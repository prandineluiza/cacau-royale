<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ADM</title>
    <link rel="stylesheet" href="adm.css">
</head>
<body>
    <div class="inicio">
        <div class="topo">
            <h3>SUA CONTA ROYALE</h3>
            <button>Retornar a loja</button>
        </div>
        <h2>Entre na sua conta</h2>
        <p>Continue sua experiência com a Cacau Royale</p>
    </div>

    <div class="meio">
    <div class="opcoes">
        <h2>SOU CLIENTE</h2>
        <h2>SOU ADMINISTRADOR</h2>
    </div>
    <hr class="linha-horizontal">
</div>

<div class="formulario">

        <div class="campo">
            <label>E-mail</label>
            <input type="text" placeholder="Digite seu e-mail">
        </div>

        <div class="campo">
            <label>Senha</label>
            <input type="email" placeholder="Digite sua senha">
        </div>
<div>
<div class="lembrar">
    <div class="check">
    <input type="checkbox" id="lembrar">
    <label for="lembrar">Lembrar de mim</label>
    </div>
    <h3>ESQUECI MINHA SENHA</h3>
</div>

<div class="final">
    <button>ENTRAR NA MINHA CONTA</button>
</div>

<div class="demonstracao">
    <h3>ACESSO DE DEMONSTRAÇÃO</h3>
    <p>
        Os dados já estão preenchidos. Use a senha 123456 e alterne entre Cliente e Administrador acima.
    </p>
</div>

<div class="complemento">
        <h2>Ainda não tem uma conta? <span>Criar Cadastro</span></h2>
    </div> 
</body>
</html>
